<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои финансы</title>
<style>
:root{--bg:#f4f4f7;--card:#fff;--tx:#111;--mut:#777;--line:#e3e3e8;--inc:#16a34a;--exp:#e11d48;--acc:#4f46e5;--sel:#e0e7ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mut:#8e8e93;--line:#2c2c2e;--inc:#30d158;--exp:#ff453a;--acc:#818cf8;--sel:#2b2f55}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mut:#8e8e93;--line:#2c2c2e;--inc:#30d158;--exp:#ff453a;--acc:#818cf8;--sel:#2b2f55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.nav button{font-size:22px;padding:4px 14px}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.sum small{display:block;color:var(--mut);font-size:12px}
.sum b{font-size:15px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}
.day{min-height:56px;border-radius:10px;padding:3px 2px;text-align:center;font-size:13px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px}
.day.sel{background:var(--sel);border-color:var(--acc)}
.day.today span{background:var(--acc);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-block;line-height:22px}
.day i{font-style:normal;font-size:10px;line-height:1.15}
.op{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.op:last-child{border:0}
.op small{color:var(--mut);display:block}
.op button{color:var(--mut);padding:4px 8px}
.add{width:100%;background:var(--acc);color:#fff;border-radius:12px;padding:12px;font-weight:600;margin-top:10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar div{height:100%;background:var(--exp)}
.cat{margin-bottom:12px}
.cat div.r{display:flex;justify-content:space-between}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:12px 0;font-size:13px;color:var(--mut)}
.tabs button.on{color:var(--acc);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{padding:10px;border-radius:10px;background:var(--bg)}
.seg button.on.e{background:var(--exp);color:#fff}.seg button.on.i{background:var(--inc);color:#fff}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.empty{color:var(--mut);text-align:center;padding:12px}
.cancel{width:100%;padding:10px;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1><span id="title">📅 Календарь</span><button id="eye" title="Скрыть суммы">🙈</button></h1>
<div class="card nav"><button id="prev">‹</button><span id="mon"></span><button id="next">›</button></div>
<div class="card sum"><div><small>Доходы</small><b class="inc" id="sInc"></b></div><div><small>Расходы</small><b class="exp" id="sExp"></b></div><div><small>Баланс</small><b id="sBal"></b></div></div>
<section id="vCal">
<div class="card"><div class="grid" id="grid"></div></div>
<div class="card"><b id="dTitle"></b><div id="dList"></div><button class="add" id="addBtn">+ Записать операцию</button></div>
</section>
<section id="vStat" hidden>
<div class="card"><b>Расходы по категориям</b><div id="cats" style="margin-top:12px"></div></div>
<div class="card"><b>Доходы по источникам</b><div id="incs" style="margin-top:12px"></div></div>
</section>
</main>
<div class="tabs"><button id="t1" class="on">📅 Календарь</button><button id="t2">📊 Итоги</button></div>
<div class="modal" id="modal"><div class="sheet">
<div class="seg"><button id="bE" class="on e">➖ Расход</button><button id="bI" class="i">➕ Доход</button></div>
<input id="amt" inputmode="text" placeholder="Сумма ₽ (можно 7+159)">
<select id="cat"></select>
<input id="date" type="date">
<input id="note" placeholder="Заметка (по желанию)">
<button class="add" id="save">Сохранить</button>
<button class="cancel" id="close">Закрыть</button>
</div></div>
<script>
const EXP=["🛒 Продукты","🚕 Транспорт","🏠 Жильё","🍔 Кафе","🎮 Развлечения","💊 Здоровье","👕 Одежда","📦 Другое"];
const INC=["💼 Зарплата","💻 Фриланс","🎁 Подарок","💰 Другое"];
let ops=[],hide=false,type="exp";
try{ops=JSON.parse(localStorage.getItem("fin_ops")||"[]")}catch(e){ops=[]}
const save=()=>{try{localStorage.setItem("fin_ops",JSON.stringify(ops))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const money=n=>hide?"•••• ₽":Math.round(n).toLocaleString("ru-RU")+" ₽";
const short=n=>hide?"••":(n>=10000?Math.round(n/1000)+"к":Math.round(n));
let cur=new Date();cur.setDate(1);let sel=iso(new Date());
const ym=()=>cur.getFullYear()+"-"+pad(cur.getMonth()+1);
function render(){
 const m=ym(),mo=ops.filter(o=>o.date.startsWith(m));
 const inc=mo.filter(o=>o.type=="inc").reduce((a,o)=>a+o.amt,0),exp=mo.filter(o=>o.type=="exp").reduce((a,o)=>a+o.amt,0);
 $("mon").textContent=cur.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
 $("sInc").textContent=money(inc);$("sExp").textContent=money(exp);
 const b=$("sBal");b.textContent=money(inc-exp);b.className=inc-exp>=0?"inc":"exp";
 let h=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>`<div class="wd">${d}</div>`).join("");
 const first=(cur.getDay()+6)%7,days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),today=iso(new Date());
 for(let i=0;i<first;i++)h+="<div></div>";
 for(let d=1;d<=days;d++){
  const ds=m+"-"+pad(d),L=mo.filter(o=>o.date==ds);
  const di=L.filter(o=>o.type=="inc").reduce((a,o)=>a+o.amt,0),de=L.filter(o=>o.type=="exp").reduce((a,o)=>a+o.amt,0);
  h+=`<button class="day${ds==sel?" sel":""}${ds==today?" today":""}" data-d="${ds}"><span>${d}</span>${di?`<i class="inc">+${short(di)}</i>`:""}${de?`<i class="exp">−${short(de)}</i>`:""}</button>`;
 }
 $("grid").innerHTML=h;
 const dl=ops.filter(o=>o.date==sel);
 $("dTitle").textContent=new Date(sel+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"long"});
 $("dList").innerHTML=dl.length?dl.map(o=>`<div class="op"><div>${o.cat}${o.note?`<small>${esc(o.note)}</small>`:""}</div><div><b class="${o.type}">${o.type=="inc"?"+":"−"}${money(o.amt)}</b><button data-del="${o.id}">✕</button></div></div>`).join(""):'<div class="empty">Нет записей</div>';
 stats(mo);
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function group(mo,t){const g={};mo.filter(o=>o.type==t).forEach(o=>g[o.cat]=(g[o.cat]||0)+o.amt);return Object.entries(g).sort((a,b)=>b[1]-a[1])}
function stats(mo){
 const f=(t,el)=>{const g=group(mo,t),tot=g.reduce((a,x)=>a+x[1],0);
  $(el).innerHTML=g.length?g.map(([c,v])=>`<div class="cat"><div class="r"><span>${c}</span><b>${money(v)}</b></div><div class="bar"><div style="width:${v/tot*100}%;${t=="inc"?"background:var(--inc)":""}"></div></div></div>`).join(""):'<div class="empty">Пока пусто</div>'};
 f("exp","cats");f("inc","incs");
}
function openM(){setType(type);$("date").value=sel;$("amt").value="";$("note").value="";$("modal").classList.add("show");setTimeout(()=>$("amt").focus(),50)}
function setType(t){type=t;$("bE").className=t=="exp"?"on e":"";$("bI").className=t=="inc"?"on i":"";$("cat").innerHTML=(t=="exp"?EXP:INC).map(c=>`<option>${c}</option>`).join("")}
$("bE").onclick=()=>setType("exp");$("bI").onclick=()=>setType("inc");
$("addBtn").onclick=openM;$("close").onclick=()=>$("modal").classList.remove("show");
$("save").onclick=()=>{
 const amt=$("amt").value.replace(/,/g,".").split("+").reduce((a,x)=>a+(parseFloat(x)||0),0);
 if(amt<=0||!$("date").value){$("amt").focus();return}
 ops.push({id:Date.now(),date:$("date").value,type,amt,cat:$("cat").value,note:$("note").value.trim()});
 save();sel=$("date").value;cur=new Date(sel+"T00:00");cur.setDate(1);$("modal").classList.remove("show");render();
};
$("grid").onclick=e=>{const b=e.target.closest("[data-d]");if(b){sel=b.dataset.d;render()}};
$("dList").onclick=e=>{const b=e.target.closest("[data-del]");if(b){ops=ops.filter(o=>o.id!=b.dataset.del);save();render()}};
$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$("eye").onclick=()=>{hide=!hide;$("eye").textContent=hide?"👁":"🙈";render()};
function tab(n){$("vCal").hidden=n!=1;$("vStat").hidden=n!=2;$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";$("title").textContent=n==1?"📅 Календарь":"📊 Итоги"}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
render();
</script>
</body>
</html>
